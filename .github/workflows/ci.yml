name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um PR com vários commits empilhados não precisa de execuções intermediárias.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Suíte de testes
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Instala dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libadwaita-1-0 \
            poppler-utils \
            xvfb \
            dbus-x11 \
            python3-venv

      - name: Prepara o ambiente
        # `--system-site-packages` é obrigatório: os bindings do PyGObject vêm
        # do apt (precisam das typelibs GTK/Adw do sistema) e um interpreter
        # instalado pelo setup-python não enxergaria /usr/lib/python3/dist-packages.
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          # --no-deps pelo mesmo motivo: PyGObject do pip não traz as typelibs.
          # As dependências puramente Python entram na linha seguinte. Pillow
          # está entre elas porque os testes cobrem os caminhos de visão e de
          # área de transferência que dependem da biblioteca.
          .venv/bin/pip install -e . --no-deps
          .venv/bin/pip install pytest Pillow requests beautifulsoup4 websockets

      - name: Roda a suíte
        # A interface precisa de um servidor gráfico; xvfb dá um sem hardware.
        run: xvfb-run -a .venv/bin/python -m pytest -q
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}

      - name: Confere que o CSS viaja no pacote
        run: |
          .venv/bin/python - <<'PY'
          from importlib.resources import files
          css = files("zorin_copilot").joinpath("data/zorin-copilot.css").read_text()
          assert len(css) > 500, "CSS não viajou no pacote"
          print(f"CSS ok ({len(css)} bytes)")
          PY

  # Arch é rolling release: é onde PyGObject, GTK e libadwaita quebram primeiro.
  # Rodar a suíte aqui pega regressões antes de chegarem ao usuário.
  tests-arch:
    name: Suíte de testes (Arch Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Instala dependências de sistema
        run: |
          pacman -Sy --noconfirm --needed \
            python python-pip python-gobject \
            gtk4 libadwaita \
            poppler \
            xorg-server-xvfb \
            dbus at-spi2-core \
            git

      - uses: actions/checkout@v4

      - name: Prepara o ambiente
        # PyGObject vem do pacman: instalá-lo pelo pip quebraria por PEP 668 e
        # por falta de typelibs. --no-deps mantém essa separação explícita.
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/pip install -e . --no-deps
          .venv/bin/pip install pytest Pillow requests beautifulsoup4 websockets

      - name: Mostra o ambiente detectado
        run: |
          .venv/bin/python -c "
          from zorin_copilot.core.desktop.env import detect_environment
          env = detect_environment()
          print('distro :', env.distro.pretty_name or env.distro.id)
          print('pm     :', env.package_manager)
          print('desktop:', env.desktop or '(nenhum)')
          print('sessão :', env.session_type or '(nenhuma)')
          "

      - name: Roda a suíte
        # Sem um barramento de acessibilidade o GTK aborta o processo com
        # `dbind-ERROR: AT-SPI: Couldn't connect to accessibility bus` — o que
        # aparece como "core dumped" e parece bug do projeto. Subir o launcher
        # antes evita isso; o dbus-run-session dá a sessão que ele exige.
        run: |
          xvfb-run -a dbus-run-session -- bash -c '
            for launcher in /usr/lib/at-spi-bus-launcher /usr/libexec/at-spi-bus-launcher; do
              if [ -x "$launcher" ]; then "$launcher" --launch-immediately & break; fi
            done
            sleep 1
            .venv/bin/python -m pytest -q
          '
        env:
          XDG_RUNTIME_DIR: /tmp

  # O setup.sh não pode abortar por falta de dpkg/apt — era exatamente o que
  # acontecia no Arch antes da detecção multi-distribuição.
  setup-arch:
    name: Setup multi-distribuição (Arch)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Instala dependências mínimas
        run: |
          pacman -Sy --noconfirm --needed \
            python python-pip python-gobject gtk4 libadwaita \
            poppler xorg-server-xvfb dbus git

      - uses: actions/checkout@v4

      - name: Roda o setup sem interação e sem instalar pacotes
        # AUTO_INSTALL=0 evita tocar no sistema; validamos apenas o fluxo.
        run: AUTO_INSTALL=0 ./setup.sh </dev/null || true

      - name: Confere que o venv, os links e o lançador foram criados
        run: |
          test -x "$HOME/.local/share/zorin-copilot/venv/bin/zorin-copilot"
          test -L "$HOME/.local/bin/zorin-copilot"
          test -f "$HOME/.local/share/applications/io.github.bruno.ZorinCopilot.desktop"
          echo "Setup Arch ok"

  # Compositor wlroots de verdade. O container Arch cobre "sem GNOME", mas não
  # cobre "com Wayland": é aqui que survivem os bugs de detect_environment, de
  # seleção de backend e de captura. Roda com continue-on-error porque subir
  # Sway headless em container é sensível à imagem — o job é sinal, não porteiro.
  sway-arch:
    name: Sessão Sway real (Arch)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: archlinux:latest

    steps:
      - name: Instala Sway e dependências
        run: |
          pacman -Sy --noconfirm --needed \
            python python-pip python-gobject \
            gtk4 libadwaita \
            poppler git \
            sway seatd grim slurp wl-clipboard \
            dbus

      - uses: actions/checkout@v4

      - name: Prepara o ambiente
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/pip install -e . --no-deps
          .venv/bin/pip install pytest Pillow requests beautifulsoup4 websockets

      - name: Sobe o Sway em modo headless
        run: |
          mkdir -p /tmp/xdg && chmod 700 /tmp/xdg
          seatd -u root &
          sleep 1
          mkdir -p /tmp/swaylog
          WLR_BACKENDS=headless \
          WLR_LIBINPUT_NODEVICES=1 \
          XDG_RUNTIME_DIR=/tmp/xdg \
          nohup sway --config /dev/null --debug > /tmp/swaylog/sway.log 2>&1 &
          for i in $(seq 1 30); do
            [ -S /tmp/xdg/wayland-0 ] && break
            sleep 1
          done
          test -S /tmp/xdg/wayland-0 || { cat /tmp/swaylog/sway.log; exit 1; }
          echo "WAYLAND_DISPLAY=wayland-0" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=/tmp/xdg" >> "$GITHUB_ENV"
          echo "XDG_SESSION_TYPE=wayland" >> "$GITHUB_ENV"

      - name: Confere a detecção de ambiente num compositor real
        run: |
          .venv/bin/python -c "
          from zorin_copilot.core.desktop import env as desktop_env
          detected = desktop_env.detect_environment()
          print('desktop:', detected.desktop)
          print('sessão :', detected.session_type)
          assert detected.desktop == 'sway', f'esperava sway, veio {detected.desktop!r}'
          assert detected.is_wlroots, 'sway deveria contar como wlroots'
          "

      - name: Confere backends escolhidos sob wlroots
        run: |
          .venv/bin/python -c "
          from zorin_copilot.core.desktop.env import detect_environment
          from zorin_copilot.core.desktop import screenshot, shortcuts
          env = detect_environment()
          print('atalhos  :', shortcuts.select_backend(env).name)
          print('captura  :', screenshot.select_backend(env).name)
          print('faltando :', screenshot.missing_dependencies(env) or 'nada')
          assert shortcuts.select_backend(env).name == 'sway'
          "

      - name: Roda a suíte de portabilidade dentro da sessão
        run: .venv/bin/python -m pytest tests/test_desktop_portability.py -q
