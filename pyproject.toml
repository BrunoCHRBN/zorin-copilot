[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zorin-copilot"
version = "0.1.0"
description = "Assistente de IA integrado ao desktop Linux (GNOME, KDE Plasma, Hyprland, Sway)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Bruno" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Wayland",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

# PyGObject NÃO entra aqui de propósito. Ele precisa das typelibs do sistema
# (gir1.2-gtk-4.0 / gir1.2-adw-1) e, no Arch — que marca o Python como
# EXTERNALLY-MANAGED (PEP 668) —, instalar via pip além de falhar conflita com o
# python-gobject do pacman. Instale pelo gerenciador da distro; o `doctor` avisa
# quando ele estiver faltando.
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "websockets>=12.0",
]

# Pillow fica de fora de `dependencies`: `core/vision.py` e `core/clipboard.py`
# a importam dentro de try/except e degradam sem ela. Mas os testes exercem os
# caminhos que dependem da biblioteca, então ela é obrigatória para rodar a suíte.
#
# `voice` também é opcional: piper-tts e faster-whisper puxam onnxruntime e
# ctranslate2, nativos pesados que travam a instalação em Arch (Python 3.13).
# Sem eles a voz local fica indisponível, mas o resto do app funciona.
[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "Pillow>=9.0",
]
voice = [
    "piper-tts>=1.2.0",
    "faster-whisper>=1.0.0",
]
# Palavra de ativação offline. Além do pacote, é preciso baixar um modelo
# (ex.: vosk-model-small-pt-0.3) e apontar o caminho em Preferências.
wakeword = [
    "vosk>=0.3.45",
]

[project.scripts]
zorin-copilot = "zorin_copilot.ui.app:main"
zorin-copilot-cli = "zorin_copilot.cli:main"
hy4 = "zorin_copilot.hy4:main"

[tool.setuptools.packages.find]
where = ["src"]

# A folha de estilo precisa viajar dentro do pacote, senão o app sobe sem tema.
[tool.setuptools.package-data]
"zorin_copilot.data" = ["*.css"]
